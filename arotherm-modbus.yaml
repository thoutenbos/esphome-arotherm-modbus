esphome:
  name: arotherm-modbus
  friendly_name: aroTHERM Modbus
  comment: "Modbus reader for Vaillant aroTHERM heatpumps"

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/thoutenbos/esphome-arotherm-modbus
      ref: main
    components: [ arotherm_modbus ]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  # level DEBUG will dump the raw messages
  level: INFO
  tx_buffer_size: 4096

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_time

arotherm_modbus:
  time_id: ha_time
  rx_pin: 21

  # --- Temperatures ---
  air_inlet_temp:
    id: air_inlet_temp
    name: "Air Inlet Temp"
  outside_temp:
    name: "Outside Temp"
  flow_temp:
    id: flow_temp
    name: "Flow Temp"
  return_temp:
    id: return_temp
    name: "Return Temp"
  delta_t:
    name: "Delta T"
  requested_flow_temp:
    name: "Requested Flow Temp"
  flow_return_calibration:
    name: "Flow-Return Calibration"

  # --- Refrigerant circuit ---
  compressor_inlet_temp:
    name: "Compressor Inlet Temp"
  compressor_outlet_temp:
    name: "Compressor Outlet Temp"
  eev_outlet_temp:
    name: "EEV Outlet Temp"
  condensor_outlet_temp:
    name: "Condensor Outlet Temp"
  condensing_temp:
    name: "Condensing Temp"
  evaporating_temp:
    name: "Evaporating Temp"
  high_pressure:
    name: "High Pressure"
  low_pressure:
    name: "Low Pressure"
  subcooling:
    name: "Subcooling"
  superheat:
    name: "Superheat"
  eev_position:
    name: "EEV Position"
  eev_position_status:
    name: "EEV Position Status"
  derated_temp_ceiling:
    name: "Derated Temp Ceiling"

  # --- Compressor and fan ---
  compressor_speed:
    id: compressor_speed
    name: "Compressor Speed"
  compressor_speed_target:
    name: "Compressor Speed Target"
  compressor_speed_min:
    name: "Compressor Speed Min"
  compressor_speed_max:
    name: "Compressor Speed Max"
  compressor_slew_limit:
    name: "Compressor Slew Limit"
  compressor_speed_stable_time:
    name: "Compressor Speed Stable Time"
  compressor_ramp_state:
    name: "Compressor Ramp State"
  fan1_speed:
    name: "Fan1 Speed"
  fan_speed_target:
    name: "Fan Speed Target"
  fan_target_stable_time:
    name: "Fan Target Stable Time"

  # --- Water side ---
  water_pressure:
    name: "Water Pressure"
  building_circuit_flow:
    name: "Building Circuit Flow"
  building_circuit_flow_target:
    name: "Building Circuit Flow Target"
  building_pump_power:
    name: "Building Pump Power"
  heat_output:
    id: heat_output
    name: "Heat Output"
  hot_water_mode_active:
    name: "Hot Water Mode Active"

  # --- Electrical ---
  electric_power_consumption:
    id: electric_power_consumption
    name: "Electric Power Consumption"
  mains_voltage:
    name: "Mains Voltage"
  active_current:
    name: "Mains Current"

  # --- Demand and state ---
  demand_mode:
    name: "Demand Mode"
  demand_state:
    name: "Demand State"
  run_phase:
    name: "Run Phase"
  demand_window:
    name: "Demand Window"
  lockout_duration:
    name: "Lockout Duration"

  # --- Defrost ---
  defrost_sequence:
    name: "Defrost Sequence"
  defrost_active:
    name: "Defrost Active"
  defrost_capacity_loss:
    name: "Defrost Capacity Loss"
  defrost_reference_heat_output:
    name: "Defrost Reference Heat Output"
  defrost_reference_attempt:
    name: "Defrost Reference Attempt"
  time_since_defrost:
    name: "Time Since Defrost"

  # --- Identity ---
  serial_number:
    name: "Serial Number"
  firmware_version:
    name: "Firmware Version"

  # aroTHERM Split plus (outdoor VWL 75/8.2 + indoor VWL 77/8.2 IS): the
  # indoor unit owns the water circuit, so remove water_pressure,
  # building_circuit_flow, run_phase and requested_flow_temp above (they
  # carry no data there) and use this instead. On a VWZ AI it reads the same
  # as building_circuit_flow.
  # building_circuit_flow_split:
  #   name: "Building Circuit Flow"

# --- Calculated values -------------------
sensor:
  # Heat Output (W) over electric power (W). Unavailable rather than zero
  # while the compressor is stopped: a COP has no value when nothing runs,
  # and zeroes would drag every average and long-term statistic down.
  - platform: template
    name: "Heat Pump COP"
    id: heat_pump_cop
    accuracy_decimals: 2
    icon: "mdi:heat-pump-outline"
    state_class: measurement
    update_interval: 10s
    lambda: |-
      float heat_w = id(heat_output).state;
      float electric_w = id(electric_power_consumption).state;
      float rps = id(compressor_speed).state;
      if (std::isnan(heat_w) || std::isnan(electric_w) || std::isnan(rps))
        return {};
      if (rps <= 0.0f || electric_w < 50.0f)
        return {};
      return heat_w / electric_w;

  # Second-law efficiency: how much of the thermodynamic ceiling the machine
  # reaches. Carnot COP is the best any heat pump could do between the same
  # two temperatures, T_hot / (T_hot - T_cold) in kelvin, so this ratio takes
  # the weather and the flow temperature out and leaves the machine's own
  # quality. Real air-source units sit around 30-50%.
  #
  # T_hot is the mean of flow and return, the sink temperature the condenser
  # works against; T_cold is the air inlet, what the evaporator actually sees
  # (outside_temp is a damped controller value). It chains off Heat Pump COP,
  # so it is unavailable while the compressor is stopped.
  - platform: template
    name: "Carnot Efficiency"
    id: carnot_efficiency
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    icon: "mdi:gauge-full"
    update_interval: 10s
    lambda: |-
      float cop = id(heat_pump_cop).state;
      float t_flow = id(flow_temp).state;
      float t_ret = id(return_temp).state;
      float t_air = id(air_inlet_temp).state;
      if (std::isnan(cop) || std::isnan(t_flow) || std::isnan(t_ret) || std::isnan(t_air))
        return {};
      if (cop <= 0.0f)
        return {};
      float t_hot = (t_flow + t_ret) * 0.5f + 273.15f;
      float lift = t_hot - (t_air + 273.15f);
      if (lift < 1.0f)
        return {};
      return 100.0f * cop / (t_hot / lift);
