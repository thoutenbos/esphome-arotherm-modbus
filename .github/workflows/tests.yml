name: tests

on:
  push:
  pull_request:

jobs:
  host:
    name: host tests (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay captures through the component
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/run_tests.py -v

  esphome-config:
    name: esphome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome
      - name: Validate the example configuration
        run: python3 tests/esphome_config.py
